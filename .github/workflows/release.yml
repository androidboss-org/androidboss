name: Release

# Push a tag vX.Y.Z (matching packages/cli/package.json) to release:
# the CLI is published to npmjs.com through npm trusted publishing (OIDC, no
# stored token) with provenance, and a GitHub Release gets the package tarball.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.0
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing and provenance
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; Node 24 ships with it.
      - name: Check npm supports trusted publishing
        run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm '+process.argv[1]+' is too old for trusted publishing'); process.exit(1) }" "$(npm -v)"
      - run: npm ci

      - name: Check the tag matches the CLI version
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG doesn't match packages/cli/package.json version $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: npm test

      - name: Publish to npm
        run: |
          if npm view "androidboss@$VERSION" version >/dev/null 2>&1; then
            echo "androidboss@$VERSION is already on npm; skipping."
          else
            npm publish -w androidboss --access public
          fi

      - name: Pack for the release
        working-directory: packages/cli
        run: npm pack --ignore-scripts

      - name: Create the GitHub Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "packages/cli/androidboss-$VERSION.tgz" --clobber
          else
            gh release create "$TAG" "packages/cli/androidboss-$VERSION.tgz" --title "$TAG" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
